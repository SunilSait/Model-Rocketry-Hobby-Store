<!DOCTYPE html>
<html lang="en" id="root-html">
<head>

    <meta name="description" content="Page not found. The page you're looking for doesn't exist or has launched into orbit.">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

</head>
<body class="fullscreen-page">

            <polygon points="33.5,3 36,7.5 31.5,6.5" fill="#155EEF"/>
            <g transform="translate(19, 19) rotate(34) translate(-19, -19)">
                <path d="M 19 6 C 17.5 11 16.5 15 16.5 23 L 19 23 Z" class="logo-mark-graphite" fill="currentColor"/>
                <path d="M 19 6 C 20.5 11 21.5 15 21.5 23 L 19 23 Z" fill="#155EEF"/>
                <polygon points="16.5,18 11.5,24.5 14.5,24.5 16.5,22.5" class="logo-mark-graphite" fill="currentColor"/>
                <polygon points="21.5,18 26.5,24.5 23.5,24.5 21.5,22.5" fill="#155EEF"/>
                <polygon points="17.5,23.5 17,26 21,26 20.5,23.5" class="logo-mark-graphite" fill="currentColor"/>

        </svg>
        <div class="nav-logo-text">
            <span class="brand-top">APEX</span>
            <span class="brand-bottom">Rocketry</span>
        </div>
    </a>
    <div style="display:flex;gap:0.5rem;">
        <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction">
            <span class="dir-label" style="font-size:0.625rem;font-weight:600;">LTR</span>
        </button>
        <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
            <span class="theme-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
        </button>
    </div>
</div>

<!-- Content -->
<div class="fullscreen-content">
    <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
        <div class="error-illustration">
            <!-- Spinning orbital rocket backdrop -->
            <svg class="orbit-spin" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="70" cy="70" r="58" stroke="#155EEF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
                <ellipse cx="70" cy="70" rx="66" ry="24" stroke="#155EEF" stroke-width="1.5" transform="rotate(-30 70 70)" opacity="0.3"/>
                <circle cx="118" cy="46" r="4" fill="#155EEF" opacity="0.9"/>
                <circle cx="22" cy="94" r="3" fill="#242424" opacity="0.7"/>
                <path d="M70 14 L77 33 L70 29 L63 33 Z" fill="#155EEF" opacity="0.9"/>
            </svg>
            <div class="error-code">404</div>
        </div>
        <div class="error-subtitle">Houston, We Have a Problem</div>
        <p class="error-desc">Looks like this rocket veered off its planned trajectory! The page you're searching for has been moved, deorbited, or never existed.</p>
        <div style="display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;">
            <a href="index.html" class="btn btn-primary btn-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>

            <a href="contact.html" class="btn btn-secondary btn-lg">

                Contact Support
            </a>
        </div>
    </div>
</div>
